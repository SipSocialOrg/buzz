name: Plan 141 Windows hotfix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows hotfix
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BASE_SHA: 39f8b46935736334cdd7045a4e4b5d7eb1a33888
      HOTFIX_VERSION: 0.5.19-plan141.1
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact surgical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = "1"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"..HEAD
          git diff --name-only "$BASE_SHA"..HEAD > changed-files.txt
          cat > expected-files.txt <<'EOF'
          .github/workflows/plan141-windows-hotfix.yml
          desktop/src-tauri/src/commands/channels/fetch.rs
          desktop/src-tauri/src/commands/channels_tests.rs
          desktop/src-tauri/src/commands/messages/forum.rs
          desktop/src-tauri/src/observed_unread.rs
          desktop/src-tauri/src/unread_catch_up.rs
          desktop/src/features/channels/isDmNotifiableKind.test.mjs
          desktop/src/features/channels/isDmNotifiableKind.ts
          desktop/src/features/channels/useLiveChannelUpdates.ts
          desktop/src/features/channels/useUnreadChannels.ts
          desktop/src/features/communities/communityUnreadObserver.ts
          desktop/src/features/home/ui/HomeView.tsx
          desktop/src/features/messages/lib/formatTimelineMessages.ts
          desktop/src/features/notifications/hooks.ts
          desktop/src/features/notifications/lib/feed.ts
          desktop/src/features/notifications/lib/homeBadge.ts
          desktop/src/features/notifications/use-feed-desktop-notifications.ts
          desktop/src/shared/lib/humanChannelEventPolicy.test.mjs
          desktop/src/shared/lib/humanChannelEventPolicy.ts
          desktop/src/shared/lib/humanChannelSurfaces.test.mjs
          EOF
          diff -u expected-files.txt changed-files.txt

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install exact dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Test desktop TypeScript
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          pnpm test
          pnpm typecheck
          pnpm check
          pnpm check:file-sizes
          pnpm build

      - name: Test desktop Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all --check
          cargo test --manifest-path desktop/src-tauri/Cargo.toml -p buzz-desktop --lib

      - name: Set isolated hotfix version
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          node scripts/set-version-from-tag.mjs "$HOTFIX_VERSION"
          cd src-tauri
          cargo update --workspace

      - name: Build Windows sidecars
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Windows installer
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          pnpm tauri build --verbose --target "$TARGET" --bundles nsis

      - name: Verify and checksum installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="desktop/src-tauri/target/${TARGET}/release/bundle/nsis"
          installer="$(find "$bundle_dir" -maxdepth 1 -name '*.exe' -type f | head -1)"
          test -n "$installer"
          case "$(basename "$installer")" in
            *"${HOTFIX_VERSION}"*) ;;
            *) echo "Unexpected installer name: $installer" >&2; exit 1 ;;
          esac
          sha256sum "$installer" | tee "${installer}.sha256"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "checksum=${installer}.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Buzz-0.5.19-plan141.1-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.artifact.outputs.installer }}
            ${{ steps.artifact.outputs.checksum }}
